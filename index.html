<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HN Lens — a smarter, personalized Hacker News reader</title>
    <meta
      name="description"
      content="A fast, private, personalized Hacker News reader — a For You recommendation feed, custom ranking, a clean comments experience, and optional on-device AI summaries. Runs entirely in your browser; no backend, no tracking."
    />
    <link rel="canonical" href="https://hn-lens.github.io/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Jianling Zhong" />
    <meta
      name="keywords"
      content="Hacker News, HN reader, Hacker News client, personalized Hacker News, HN recommendations, AI summaries, in-browser AI, WebLLM, news reader"
    />

    <!-- Icons + PWA -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph (Facebook / LinkedIn / Slack / Discord / iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HN Lens" />
    <meta property="og:title" content="HN Lens — a smarter, personalized Hacker News reader" />
    <meta
      property="og:description"
      content="A For You recommendation feed, custom ranking, a clean comments experience, and optional on-device AI summaries — running entirely in your browser."
    />
    <meta property="og:url" content="https://hn-lens.github.io/" />
    <meta property="og:image" content="https://hn-lens.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HN Lens — a smarter, personalized Hacker News reader" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HN Lens — a smarter, personalized Hacker News reader" />
    <meta
      name="twitter:description"
      content="A For You recommendation feed, custom ranking, a clean comments experience, and optional on-device AI summaries — all in your browser."
    />
    <meta name="twitter:image" content="https://hn-lens.github.io/og.png" />

    <!-- Structured data: rich result eligibility -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "HN Lens",
        "alternateName": "HN Lens — a smarter Hacker News",
        "url": "https://hn-lens.github.io/",
        "description": "A fast, private, personalized Hacker News reader — a For You recommendation feed, custom ranking, a clean comments experience, and optional on-device AI summaries. Runs entirely in your browser.",
        "applicationCategory": "NewsApplication",
        "operatingSystem": "Any (modern web browser)",
        "browserRequirements": "Requires JavaScript. Optional on-device AI requires WebGPU.",
        "image": "https://hn-lens.github.io/og.png",
        "screenshot": "https://hn-lens.github.io/og.png",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Personalized For You recommendation feed",
          "Custom ranking with tunable weights and an explainable \"why\"",
          "On-device AI summaries (WebLLM) with an optional bring-your-own-key cloud LLM",
          "Comments-focused reading experience",
          "Runs entirely in the browser — no backend, no tracking"
        ],
        "author": { "@type": "Person", "name": "Jianling Zhong" },
        "license": "https://opensource.org/licenses/MIT",
        "sameAs": "https://github.com/hn-lens/hn-lens.github.io"
      }
    </script>

    <script>
      // Set theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('hn:theme');
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 42rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>HN Lens — a smarter, personalized Hacker News reader</h1>
        <p>
          HN Lens is a fast, private Hacker News reader that runs entirely in your browser. It adds a
          personalized <strong>For You</strong> recommendation feed, custom ranking you can tune, a clean
          comments-focused reading experience, and optional on-device AI summaries — with no backend and no
          tracking.
        </p>
        <ul>
          <li>Personalized recommendation feed with explainable ranking</li>
          <li>On-device AI summaries (WebLLM) plus an optional bring-your-own-key cloud LLM</li>
          <li>Everything stays on your device — no server, no account</li>
        </ul>
        <p>HN Lens needs JavaScript to run. Learn more or view the source on
          <a href="https://github.com/hn-lens/hn-lens.github.io">GitHub</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
