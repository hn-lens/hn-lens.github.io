name: CI

# Runs the real gate on every pull request and on pushes to main.
#
# Until now `deploy.yml` was the only workflow: it triggered on push-to-main only and ran
# `npm ci && npm run build`. So the full verification gate that guards this project existed but never ran in
# CI, a contributor's pull request got no automated feedback at all, and `main` could go red without
# anything noticing. A public repo that accepts contributions needs the opposite.
#
# This runs the `standard` tier (`npm run verify`) — typecheck, lint, the generated-notices and
# source-claim checks, the production build, and every deterministic browser harness. It does
# NOT run the `full` tier: that needs a real WebGPU adapter and downloads ~1GB of model weights,
# which no hosted runner has.
#
# The internal-reference (leak) check is MAINTAINER-ONLY and is a no-op here: its pattern list lives
# in an untracked notes file, so on a runner it reports NOT RUN and exits 0. It is enforced at
# `pre-push` on the maintainer's machine. Do not "fix" that by publishing the list.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: this workflow must never be able to publish anything. Deployment stays in deploy.yml.
permissions:
  contents: read

concurrency:
  # One run per branch/PR; a new push supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # CI can only reach the public registry. A lockfile whose `resolved` URLs point at a private
      # mirror breaks `npm ci` here, so pin the registry explicitly (same guard as deploy.yml).
      - name: Use public npm registry
        run: npm config set registry https://registry.npmjs.org
      - run: npm ci
      # The browser harnesses drive Playwright's own Chromium; --with-deps installs the system
      # libraries it needs on a bare runner.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify (typecheck, lint, build, harnesses, personalization proof)
        run: npm run verify
      # Keep the evidence when something fails — the harnesses write reports and screenshots that
      # are far more useful than a red X.
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-artifacts
          path: scripts/.artifacts/
          if-no-files-found: ignore
          retention-days: 7
