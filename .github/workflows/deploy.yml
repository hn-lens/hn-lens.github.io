name: Deploy to GitHub Pages

# Publishing waits for the CI gate to pass on the SAME commit.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # An automatic publish requires all three of the following; a manual dispatch bypasses them:
    #  - conclusion == 'success': workflow_run fires for FAILED gate runs too.
    #  - event == 'push': CI also runs on pull_request. A fork's default branch is called `main`, and
    #    the workflow_run `branches` filter matches the TRIGGERING run's head branch, so a PR from
    #    `fork:main` would otherwise satisfy the filter and publish the PR's tree from a job holding
    #    `pages: write` — running the fork's lifecycle scripts and build config. See GitHub's
    #    "Preventing pwn requests".
    #  - head_repository == this repo: the same check, applied to a fork branch of any other name.
    # A manual dispatch is the maintainer's deliberate override.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # workflow_run checks out the default branch's tip by default, which is not necessarily the
          # commit the gate ran on. Publish exactly the tree that passed.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Use public npm registry
        run: npm config set registry https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
